            <div class="sidebar-footer">

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div class="medalhas-card-base">
                <header class="page-header">
                    <h1>
                        <img src="../imagem/2.png" alt="Ícone de Música" style="height: 2em; vertical-align: middle;">
                        Suas Conquistas Musicais
                    </h1>
                    <p>Acompanhe todas as medalhas conquistadas durante sua jornada no NoteWave.</p>
                </header>

                <!-- Resumo: quantas medalhas já foram conquistadas -->
                <div class="medalhas-resumo" aria-live="polite">
                    <span class="resumo-texto" id="resumoTexto"></span>
                    <div class="resumo-barra"><i id="resumoBarra"></i></div>
                </div>

                <div class="grid-medalhas">

                    <!-- Medalha 1 -->
                    <div class="card-medalha" data-chave-medalha="medalha_clave_sol" data-modulo="modulo1"
                        data-status="bloqueado" data-titulo="Clave de Sol"
                        data-conquistou="Você dominou a leitura das notas agudas!"
                        data-aprendeu="Leitura da pauta, identificação das notas e localização da Clave de Sol."
                        data-incentivo="Continue praticando! Grandes músicos começaram exatamente assim.">

                        <div class="icone-medalha">
                            <svg viewBox="0 0 100 100" style="width: 55px; height: 55px;">
                                <path fill="currentColor"
                                    d="M54.5,9 C50.1,9 46.2,16.5 45.1,25.4 C38.3,29.8 33.2,36.5 33.2,46.1 C33.2,58.3 42.1,65.2 50.5,65.2 C59.2,65.2 65.5,58.1 65.5,48.5 C65.5,41.3 61.2,35.4 55.3,32.3 C53.2,23.1 55.4,12.5 58.1,9.8 C56.8,9.2 55.7,9 54.5,9 Z M51.5,59.5 C46.2,59.5 40.8,55.1 40.8,47.2 C40.8,40.5 45.1,34.9 51.2,32.8 C53.2,41.2 57.1,51.8 59.2,56.8 C57.2,58.7 54.5,59.5 51.5,59.5 Z M53.5,67 C48.5,67 44,70.5 44,75.5 C44,80.5 48.5,84.5 53.5,84.5 C58.5,84.5 62.5,80.5 62.5,75.5 C62.5,70.5 58.5,67 53.5,67 Z" />
                            </svg>
                        </div>
                        <h3>Clave de Sol</h3>
                        <span class="status">Bloqueado</span>
                    </div>

                    <!-- Medalha 2 -->
                    <div class="card-medalha" data-chave-medalha="medalha_clave_fa" data-modulo="modulo2"
                        data-status="bloqueado" data-titulo="Clave de Fá"
                        data-conquistou="Você conquistou a leitura dos sons graves."
                        data-aprendeu="Reconhecimento das notas da Clave de Fá."
                        data-incentivo="Seu conhecimento musical está ficando cada vez mais completo!">

                        <div class="icone-medalha">
                            <svg viewBox="0 0 100 100" style="width: 50px; height: 50px;">
                                <path fill="currentColor"
                                    d="M35,25 C45,20 62,24 62,42 C62,56 50,66 42,75 L36,75 C44,65 54,55 54,43 C54,34 43,30 36,33 L35,25 Z M70,33 A 4 4 0 1 1 70,32.9 Z M70,47 A 4 4 0 1 1 70,46.9 Z" />
                            </svg>
                        </div>
                        <h3>Clave de Fá</h3>
                        <span class="status">Bloqueado</span>
                    </div>

                    <!-- Medalha 3 -->
                    <div class="card-medalha" data-chave-medalha="medalha_recife" data-modulo="recife"
                        data-status="bloqueado" data-titulo="Mestre do Recife"
                        data-conquistou="Você conquistou 3 estrelas nas 4 atividades do Recife!"
                        data-aprendeu="Reconhecer notas de ouvido, localizar na pauta, perceber subidas e descidas e dominar a teoria básica."
                        data-incentivo="Você explorou o recife inteiro. Que mergulho incrível!"
                        data-bloqueado="Conquiste 3 estrelas em cada uma das 4 atividades do Recife: Ouça a Onda, Pesque a Nota, Sobe ou Desce? e Maré de Teoria.">

                        <div class="icone-medalha">
                            <svg viewBox="0 0 100 100" style="width: 52px; height: 52px;">
                                <path fill="currentColor"
                                    d="M50,10 L61,37 L90,40 L68,60 L75,89 L50,74 L25,89 L32,60 L10,40 L39,37 Z" />
                            </svg>
                        </div>
                        <h3>Mestre do Recife</h3>
                        <span class="status">Bloqueado</span>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modalConquista">
        <div class="modal-balao" role="dialog" aria-modal="true" aria-label="Detalhes da medalha">
            <button id="btnFecharModal" class="btn-fechar" aria-label="Fechar">&times;</button>
            <div id="conteudoModal"></div>
        </div>
    </div>

    <script>
        // Aplica o Modo Escuro automaticamente ao carregar
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        // Atividades do Recife que precisam ter 3 estrelas para a medalha
        const ATIVIDADES_RECIFE = ['ouvir', 'pauta', 'sobe', 'teoria'];

        function estrelasDoRecife() {
            return ATIVIDADES_RECIFE.filter(id => Number(localStorage.getItem('status_mar_' + id)) === 3).length;
        }

        // Função para atualizar o status das medalhas com base no localStorage
        function atualizarMedalhasPeloProgresso() {
            const cards = document.querySelectorAll('.card-medalha');
            const dadosProgresso = JSON.parse(localStorage.getItem('progressoModulos')) || {};
            let conquistadas = 0;

            cards.forEach(card => {
                const chave = card.dataset.chaveMedalha;
                const modulo = card.dataset.modulo;
                const statusTexto = card.querySelector('.status');

                const medalhaConcluida = localStorage.getItem(chave) === 'true';
                let moduloConcluido = dadosProgresso[modulo] === 100;

                // Mestre do Recife: 3 estrelas em cada uma das 4 atividades
                if (chave === 'medalha_recife') {
                    moduloConcluido = estrelasDoRecife() === ATIVIDADES_RECIFE.length;
                }

                if (medalhaConcluida || moduloConcluido) {
                    conquistadas++;
                    card.classList.remove('bloqueada');
                    card.classList.add('ativa');
                    card.dataset.status = "desbloqueado";
                    if (statusTexto) statusTexto.textContent = 'Desbloqueado';
                } else {
                    card.classList.remove('ativa');
                    card.classList.add('bloqueada');
                    card.dataset.status = "bloqueado";
                    if (statusTexto) statusTexto.textContent = 'Bloqueado';
                }
            });

            // Resumo no topo da página
            const resumoTexto = document.getElementById('resumoTexto');
            const resumoBarra = document.getElementById('resumoBarra');
            if (resumoTexto) {
                resumoTexto.textContent = `🏅 ${conquistadas} de ${cards.length} medalhas conquistadas`;
            }
            if (resumoBarra) {
                resumoBarra.style.width = (cards.length ? conquistadas / cards.length * 100 : 0) + '%';
            }
        }

        // Explosão de notas, bolhas e estrelas que SAI DO CARD que abriu (não da medalha)
        function dispararExplosaoConquista(alvo) {
            const rect = alvo.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const alturaTela = window.innerHeight;

            const notas = ['♪', '♫', '♬', '♩'];
            const emojis = ['⭐', '✨', '💙', '🎵', '🎶'];
            const cores = ['#38bdf8', '#36d1d6', '#ffd43b', '#ffffff', '#7fe9ff', '#ff9ec4', '#a78bfa'];
            const quantidade = 70;

            for (let i = 0; i < quantidade; i++) {
                const particula = document.createElement('div');
                particula.classList.add('particula-explosao');

                const sorteio = Math.random();
                if (sorteio < 0.45) {
                    particula.textContent = notas[Math.floor(Math.random() * notas.length)];
                    particula.style.color = cores[Math.floor(Math.random() * cores.length)];
                    particula.style.fontSize = `${20 + Math.random() * 22}px`;
                } else if (sorteio < 0.72) {
                    particula.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    particula.style.fontSize = `${16 + Math.random() * 16}px`;
                } else {
                    const tamanho = 8 + Math.random() * 16;
                    particula.classList.add('bolha');
                    particula.style.width = `${tamanho}px`;
                    particula.style.height = `${tamanho}px`;
                }

                // nasce em um ponto dentro do card, perto das bordas, e segue para fora
                const angulo = Math.random() * Math.PI * 2;
                const alcance = 0.55 + Math.random() * 0.45;
                const origemX = cx + Math.cos(angulo) * (rect.width / 2) * alcance;
                const origemY = cy + Math.sin(angulo) * (rect.height / 2) * alcance;

                const distancia = 140 + Math.random() * 220;
                const txMeio = Math.cos(angulo) * distancia;
                const tyMeio = Math.sin(angulo) * distancia - 90;
                const txFim = txMeio + (Math.random() * 180 - 90);
                const tyFim = alturaTela - origemY + 80;

                particula.style.left = `${origemX}px`;
                particula.style.top = `${origemY}px`;
                particula.style.setProperty('--tx-meio', `${txMeio}px`);
                particula.style.setProperty('--ty-meio', `${tyMeio}px`);
                particula.style.setProperty('--tx-fim', `${txFim}px`);
                particula.style.setProperty('--ty-fim', `${tyFim}px`);
                particula.style.setProperty('--rot', `${Math.random() * 720 - 360}deg`);

                const duracao = 1.4 + Math.random() * 0.9;
                particula.style.animationDuration = `${duracao}s`;

                document.body.appendChild(particula);
                setTimeout(() => particula.remove(), duracao * 1000 + 100);
            }

            // brilho dourado passando pelo card
            alvo.classList.remove('mc-flash');
            void alvo.offsetWidth;
            alvo.classList.add('mc-flash');
            setTimeout(() => alvo.classList.remove('mc-flash'), 1000);
        }

        // Monta o conteúdo do card que abre ao clicar na medalha
        function estrelasHTML(qtd) {
            const caminho = 'M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z';
            const estrela = i => `<svg class="mc-estrela ${i < qtd ? 'on' : 'off'}" style="--i:${i}" viewBox="0 0 24 24" aria-hidden="true"><path d="${caminho}"/></svg>`;
            return `<div class="mc-estrelas" role="img" aria-label="${qtd} de 3 estrelas">${[0, 1, 2].map(estrela).join('')}</div>`;
        }

        const NOTAS_FLUTUANTES = `
            <span class="mc-nota" style="--x:8%;--d:0s" aria-hidden="true">♪</span>
            <span class="mc-nota" style="--x:24%;--d:1.6s" aria-hidden="true">♫</span>
            <span class="mc-nota" style="--x:70%;--d:0.8s" aria-hidden="true">♬</span>
            <span class="mc-nota" style="--x:88%;--d:2.4s" aria-hidden="true">♩</span>
            <span class="mc-nota" style="--x:48%;--d:3.2s" aria-hidden="true">♪</span>`;

        function montarCardConquistada(card) {
            const icone = card.querySelector('.icone-medalha').innerHTML;
            return `
                <div class="mc-banner">
                    ${NOTAS_FLUTUANTES}
                    <div class="mc-medalha">${icone}</div>
                    <span class="mc-tag">Conquista desbloqueada</span>
                    <h2>${card.dataset.titulo}</h2>
                    <div class="mc-onda mc-onda--2"></div>
                    <div class="mc-onda"></div>
                </div>
                <div class="mc-corpo">
                    ${estrelasHTML(3)}
                    <div class="mc-secao">
                        <div class="mc-ico" aria-hidden="true">🏆</div>
                        <div>
                            <h3>O que você conquistou?</h3>
                            <p>${card.dataset.conquistou || ''}</p>
                        </div>
                    </div>
                    <div class="mc-secao">
                        <div class="mc-ico" aria-hidden="true">🎼</div>
                        <div>
                            <h3>O que você aprendeu?</h3>
                            <p>${card.dataset.aprendeu || ''}</p>
                        </div>
                    </div>
                    <div class="mc-incentivo">
                        <span class="mc-barco" aria-hidden="true">⛵</span>
                        <p><strong>${card.dataset.incentivo || ''}</strong></p>
                    </div>
                </div>`;
        }

        function montarCardBloqueada(card) {
            const icone = card.querySelector('.icone-medalha').innerHTML;
            const texto = card.dataset.bloqueado || 'Finalize a lição correspondente na trilha com aproveitamento superior a 50% para desbloqueá-la.';

            let progresso = '';
            if (card.dataset.chaveMedalha === 'medalha_recife') {
                const feitas = estrelasDoRecife();
                const total = ATIVIDADES_RECIFE.length;
                progresso = `
                    <div class="mc-progresso">
                        <div class="mc-progresso-topo">
                            <span>Atividades com 3 estrelas</span>
                            <span>${feitas} de ${total}</span>
                        </div>
                        <div class="mc-progresso-barra"><i style="width:${feitas / total * 100}%"></i></div>
                    </div>`;
            }

            return `
                <div class="mc-banner mc-banner--lock">
                    ${NOTAS_FLUTUANTES}
                    <div class="mc-medalha">${icone}<span class="mc-cadeado" aria-hidden="true">🔒</span></div>
                    <span class="mc-tag">Medalha bloqueada</span>
                    <h2>${card.dataset.titulo}</h2>
                    <div class="mc-onda mc-onda--2"></div>
                    <div class="mc-onda"></div>
                </div>
                <div class="mc-corpo">
                    ${estrelasHTML(0)}
                    <div class="mc-secao">
                        <div class="mc-ico" aria-hidden="true">🧭</div>
                        <div>
                            <h3>Você ainda não conquistou esta medalha.</h3>
                            <p>${texto}</p>
                        </div>
                    </div>
                    ${progresso}
                </div>`;
        }

        const cards = document.querySelectorAll(".card-medalha");
        const modal = document.getElementById("modalConquista");
        const modalBalao = modal.querySelector(".modal-balao");
        const conteudoModal = document.getElementById("conteudoModal");
        const btnFechar = document.getElementById("btnFecharModal");

        // Gerenciamento dos cliques nos cards
        cards.forEach(card => {
            card.addEventListener("click", () => {
                const desbloqueado = card.dataset.status === "desbloqueado";

                conteudoModal.innerHTML = desbloqueado
                    ? montarCardConquistada(card)
                    : montarCardBloqueada(card);

                modalBalao.scrollTop = 0;
                modal.classList.add("visivel");

                // a explosão sai do card que abriu (espera ele terminar de "pular" na tela)
                if (desbloqueado) {
                    setTimeout(() => dispararExplosaoConquista(modalBalao), 180);
                }
            });
        });

        btnFechar.addEventListener("click", () => modal.classList.remove("visivel"));
        modal.addEventListener("click", (e) => { if (e.target === modal) modal.classList.remove("visivel"); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") modal.classList.remove("visivel"); });

        document.addEventListener('DOMContentLoaded', () => {
            atualizarMedalhasPeloProgresso();

            const params = new URLSearchParams(window.location.search);
            if (params.get('recompensa') === 'true' || params.get('destaque') === 'fa') {
                const tituloMedalha = params.get('titulo') || 'Clave de Fá';
                const cardPremiado = Array.from(document.querySelectorAll('.card-medalha')).find(c => c.dataset.titulo === tituloMedalha);

                if (cardPremiado) {
                    cardPremiado.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    cardPremiado.style.transition = "all 0.5s ease";
                    cardPremiado.style.borderColor = "#ffd43b";
                    cardPremiado.style.boxShadow = "0 0 30px #ffd43b, 0 0 60px rgba(255,212,59,0.4)";

                    setTimeout(() => {
                        cardPremiado.click();
                    }, 1000);
                }
            }
        });
    </script>
    <script src="../js/tour.js"></script>
    <script src="../js/tema.js"></script>
    <script src="../js/nw-sync.js"></script>
    <script src="../js/music.js"></script>
    <script src="../js/rodape.js"></script>
</body>

</html>
