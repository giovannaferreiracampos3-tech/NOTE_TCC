<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício: Leitura de Notas (Clave de Fá)</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/recompensa-fa.css">
    <link rel="stylesheet" href="../css/recompensa-fontes.css">
    <link rel="stylesheet" href="../css/onda-transicao.css">
    <link rel="stylesheet" href="../css/modo-escuro-atividades.css">
    <link rel="stylesheet" href="../css/tema.css">
</head>

<body>

   <!-- TELA FINAL: CONCLUSÃO DA TRILHA -->
   <section id="finalOcean" class="final-ocean" aria-hidden="true" style="display: none;">
    <div class="ocean-background"></div>

    <div class="ocean-result">
        <h2 id="oceanResultTitle"></h2>
        <p id="oceanResultMessage"></p>
        <p>
            Aproveitamento:
            <span id="finalPercentage">0%</span>
        </p>

        <div id="resultStars" aria-label="Estrelas conquistadas">
            <span class="result-star">⭐</span>
            <span class="result-star">⭐</span>
            <span class="result-star">⭐</span>
        </div>

        <p id="starResultMessage"></p>

        <button id="retryLessonBtn" hidden class="ocean-button">Refazer</button>
        <button id="skipLessonBtn" hidden class="ocean-button ocean-button--secondary">Pular</button>
        <button id="receiveMedalBtn" hidden class="ocean-button ocean-button--medal">RECEBER MEDALHA!</button>

        <div id="medalReveal" class="medal-reveal" hidden></div>
    </div>
</section>

    <div class="app-container">
        <!-- Cabeçalho do aplicativo -->
        <header class="app-header">
            <a href="../html/trilha_de_aulas.html" class="btn-back"
                style="text-decoration: none; display: inline-block;">← Voltar para a trilha</a>
            <button class="btn-help" id="btnHelp">💡 Dicas</button>
        </header>

        <main class="main-content">
            <!-- Seção principal do exercício -->
            <section class="exercise-section">
                <!-- Identificação dinâmica -->
                <div class="lesson-number" id="lessonNumber">Lição...</div>
                <h1 class="title" id="lessonTitle">Clave de Fá</h1>
                <p class="instruction">Ouça o áudio e identifique a nota correspondente.</p>
                <!-- Caixa de dica reflexiva -->
                <div id="helpBox" class="help-box" style="display: none;">
                    💡 <strong>Dica:</strong> <span id="helpText"></span>
                </div>

                <!-- Pentagrama musical estrutural -->
                <div class="staff-container">
                    <div class="clef">𝄢</div>
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                    <div id="noteElement" class="note"></div>
                </div>

                <!-- Player de áudio integrado -->
                <div class="audio-player">
                    <button class="play-btn" id="playBtn"><span class="play-icon">▶</span></button>
                    <div class="audio-wave">
                        <div class="wave-line"></div>
                    </div>
                    <span class="audio-time" id="audioTime">0:00 / 0:00</span>
                    <audio id="audioTrack" src=""></audio>
                </div>

                <!-- Botões puros, o clique será injetado pelo JS -->
                <div class="options-container" id="optionsContainer">
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                    <button class="option-btn"></button>
                </div>

                <!-- Painel de Feedback dinâmico -->
                <div class="feedback-panel" id="feedbackPanel" style="display: none;">
                    <div class="feedback-text">
                        <span class="feedback-icon" id="feedbackIcon"></span>
                        <div>
                            <strong id="feedbackTitle"></strong>
                            <p id="feedbackMessage"></p>
                        </div>
                    </div>
                    <button class="next-btn" id="actionBtn">Próxima</button>
                </div>
            </section>

            <!-- Barra lateral de desempenho -->
            <aside class="performance-section">
                <h2 class="perf-title">Desempenho</h2>
                <div class="stat-group">
                    <span class="stat-label">Acertos</span>
                    <span class="stat-value success-text" id="correctCount">0</span>
                </div>

                <div class="stat-group">
                    <span class="stat-label">Erros</span>
                    <span class="stat-value danger-text" id="wrongCount">0</span>
                </div>

                <div class="progress-container">
                    <div class="progress-ring" id="progressRing" style="--percent: 0;">
                        <div class="progress-inner">
                            <span class="percentage-value" id="percentageValue">0%</span>
                        </div>
                    </div>
                    <p class="progress-label">de aproveitamento</p>
                    <button id="resetBtn">Reiniciar Progresso</button>
                </div>
            </aside>
        </main>
    </div>

<!-- =====================================================
         TELAS DE RECOMPENSA (ESTILO DUOLINGO) - CLAVE DE FÁ
         ===================================================== -->
    <!-- Tela 1: Mostra as estrelas conquistadas -->
    <div id="telaEstrelas" class="duo-tela" style="display: none;">
        <div class="duo-card-recompensa">
            <h2 class="duo-titulo">Fim da Lição!</h2>
            <div class="duo-estrelas-container" id="duoEstrelasAnimadas"></div>
            <p class="duo-mensagem">Você mandou muito bem!</p>
            <button class="duo-btn" id="btnProximoEstrelas">Continuar</button>
        </div>
    </div>
     
    <!-- Tela 2: Revela a medalha conquistada -->
    <div id="telaMedalha" class="duo-tela" style="display: none;">
        <div class="duo-card-recompensa">
            <h2 class="duo-titulo-medalha">Nova Conquista!</h2>
            <div class="duo-medalha-brilho">
                <div class="icone-medalha-gigante">
                    <!-- SVG da Clave de Fá -->
                    <svg viewBox="0 0 100 100" style="width: 80px; height: 80px;">
                        <path fill="currentColor" d="M35,25 C45,20 62,24 62,42 C62,56 50,66 42,75 L36,75 C44,65 54,55 54,43 C54,34 43,30 36,33 L35,25 Z M70,33 A 4 4 0 1 1 70,32.9 Z M70,47 A 4 4 0 1 1 70,46.9 Z"/>
                    </svg>
                </div>
            </div>
            <p class="duo-mensagem-destaque">Medalha Clave de Fá</p>
            <button class="duo-btn" id="btnIrParaMedalhas">Continuar</button>
        </div>
    </div>

    <!-- Scripts modulares -->
    <script src="../js/licoes-data.js"></script>
    <script src="../js/atividades-nota.js"></script>
    <script src="../js/onda-transicao.js"></script>
    <script src="../js/licoes-data.js"></script>
    <script src="../js/tema.js"></script>
    <meta charset="UTF-8">
</body>

</html>
